<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KisanSetu - शेतकरी सेतू</title>
  <meta name="description" content="KisanSetu - Digital platform for farmers to book procurement slots." />
  <!-- Instant redirect to the login page -->
  <meta http-equiv="refresh" content="0; url=Login/login.html" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3c2e 0%, #2d6a4f 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .loader {
      text-align: center;
    }

    .loader h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .loader p {
      opacity: 0.75;
      font-size: 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1.2rem auto 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="loader">
    <h1>🌾 KisanSetu</h1>
    <p>लोड होत आहे... / Loading...</p>
    <div class="spinner"></div>
  </div>
  <script>
    window.location.replace("Login/login.html");
  </script>
</body>

</html>
