services:
  - type: web
    name: kisansetu-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kisansetu-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
